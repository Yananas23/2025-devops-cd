name: CI Pipeline

on:
  push:
    branches: ["*"]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache Maven packages
        uses: actions/cache@v3
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Run tests
        run: ./mvnw -B test

      - name: Build app
        run: ./mvnw -B clean package

      - name: Docker build
        run: docker build -f cd.dockerfile -t spring-app .

      - name: Build documentation
        run: ./mvnw -B javadoc:javadoc

        # -------------------------
        # CD — main branch only
        # -------------------------

      - name: Login to Docker Hub
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push Docker image (tag=main)
        if: github.ref == 'refs/heads/main'
        run: |
          docker build -f cd.dockerfile -t ${{ secrets.DOCKERHUB_USERNAME }}/spring-app:main .
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/spring-app:main

  deploy-on-netlify:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
      - name: Run maven test
        run: mvn javadoc:javadoc
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install netlify-cli -g
      - run: netlify deploy --no-build  --prod --dir target/site/apidocs/ --auth ${{secrets.NETLIFY_AUTH_TOKEN}} --site ${{secrets.NETLIFY_SITE_ID}}
